<style>
/* Layout: a fixed-height atlas board — province map left, a register panel right; on phones the panel drops below the map. */
:root{--bg:#f4f2ec;--paper:#ffffff;--ink:#1d2433;--muted:#5d6675;--line:#d9d4c7;--navy:#1f3864;--navy-soft:#e6ebf5;--gold:#f5e6b8;

:root[data-theme="dark"]{--bg:#15181f;--paper:#1e232c;--ink:#e8e6df;--muted:#a3a9b5;--line:#343b48;--navy:#9db3e0;--navy-soft:#242c3d;--gold:#5b4d1f;--unknown:#6b7280;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:10px}
h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;color:var(--navy);text-wrap:balance}
.kicker{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.board{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.9fr);gap:14px;align-items:start}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.mapwrap{background:var(--paper);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
svg#map{touch-action:none;user-select:none;display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1/0.82}
.prov{fill:#e9e6dc;stroke:#ffffff;stroke-width:1.6;cursor:pointer;transition:fill .18s}
:root[data-theme="dark"] .prov{fill:#2b3240;stroke:#15181f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prov{fill:#2b3240;stroke:#15181f}}
.prov:hover,.prov.active{fill:var(--gold)}
.prov.dim{opacity:.35}
.plabel{font-family:var(--font-body);font-size:13px;fill:var(--ink);pointer-events:none;font-weight:500}
.pcount{font-size:11px;fill:var(--muted);pointer-events:none}
.dot{stroke:#fff;stroke-width:1.2;cursor:pointer}
.dot.sel{stroke:var(--ink);stroke-width:2}
.dlabel{font-size:9px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:2.5px;stroke-linejoin:round}
.corridor{fill:none;stroke:var(--mou);stroke-dasharray:4 3;stroke-width:1.2;opacity:.8}
.toolbar{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;cursor:pointer}
button:hover{border-color:var(--navy)}button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.qsel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
select{font:inherit;font-size:12.5px;padding:4px 8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px 10px;border-top:1px solid var(--line);font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.attrib{padding:0 10px 8px;font-size:10px;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.panel h2{font-family:var(--font-display);font-size:17px;margin:0 0 2px;color:var(--navy)}
.panel .sub{color:var(--muted);font-size:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--navy-soft);border-radius:4px;padding:6px 8px}.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover,tr.row.sel{background:var(--navy-soft)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;color:#fff;white-space:nowrap}
.tscroll{overflow-x:auto;max-height:52vh;overflow-y:auto}
.detail{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0 0}.detail dt{color:var(--muted)}.detail dd{margin:0}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){.prov{transition:none}}
</style>

  const t=el('text',{x:cx+off[0],y:cy+off[1],class:'plabel','text-anchor':'middle','data-p':s.name});t.textContent=s.name;gLab.append(t);
  const c=el('text',{x:cx+off[0],y:cy+off[1]+13,class:'pcount','text-anchor':'middle','data-p':s.name});c.textContent=(byProv[s.name]||[]).length+' facilities';gLab.append(c);
});
let cur=null, sel=null, corridor=false, animT=null;
const home=[150,30,540,440];
function setView(v){const [x,y,w,h]=v;svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`)}
function zoomAt(px,py,factor){const vb=svg.getAttribute('viewBox').split(' ').map(Number);const rect=svg.getBoundingClientRect();
  const mx=vb[0]+(px-rect.left)/rect.width*vb[2], my=vb[1]+(py-rect.top)/rect.height*vb[3];
  const w=Math.min(540,Math.max(12,vb[2]*factor)),h=w*vb[3]/vb[2];
  setView([mx-(mx-vb[0])*(w/vb[2]),my-(my-vb[1])*(h/vb[3]),w,h]);drawDots(cur)}
svg.addEventListener('wheel',e=>{if(!cur)return;e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.18:1/1.18)},{passive:false});
let drag=null;svg.addEventListener('pointerdown',e=>{if(!cur)return;drag={x:e.clientX,y:e.clientY,vb:svg.getAttribute('viewBox').split(' ').map(Number),moved:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect();const dx=(e.clientX-drag.x)/rect.width*drag.vb[2],dy=(e.clientY-drag.y)/rect.height*drag.vb[3];if(Math.abs(dx)+Math.abs(dy)>0.5)drag.moved=true;setView([drag.vb[0]-dx,drag.vb[1]-dy,drag.vb[2],drag.vb[3]])});
svg.addEventListener('pointerup',()=>{if(drag&&drag.moved)drawDots(cur);drag=null});
let pinch=null;svg.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
svg.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2&&cur){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoomAt((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2,pinch/d);pinch=d}},{passive:false});
svg.addEventListener('touchend',()=>{pinch=null});
function animateView(to){if(matchMedia('(prefers-reduced-motion: reduce)').matches){setView(to);return}
  const from=svg.getAttribute('viewBox').split(' ').map(Number);const t0=performance.now();cancelAnimationFrame(animT);
  const step=n=>{const k=Math.min(1,(n-t0)/420),e=1-Math.pow(1-k,3);setView(from.map((f,i)=>f+(to[i]-f)*e));if(k<1)animT=requestAnimationFrame(step);else drawDots(cur)};animT=requestAnimationFrame(step)}
function drawDots(prov){gDots.innerHTML='';const list=prov?byProv[prov]:FAC;const placed=[];
  if(corridor&&prov){list.filter(f=>f.lat&&(f.acc==='MOU'||f.acc==='Owned')).forEach(f=>{const [x,y]=proj(f.lat,f.lon);gDots.append(el('ellipse',{cx:x,cy:y,rx:1.35*SX,ry:1.35*SY,class:'corridor'}))})}
  list.filter(f=>f.lat).forEach(f=>{const [x,y]=proj(f.lat,f.lon);const vbk=svg.getAttribute('viewBox').split(' ').map(Number)[2]/540;const r=(prov?(f.m?2.6+Math.sqrt(f.m)*0.55:2.6):(f.m?1.6+Math.sqrt(f.m)*0.3:1.6))*Math.max(vbk,0.12);
    const d=el('circle',{cx:x,cy:y,r,class:'dot'+(sel===f?' sel':''),fill:colorOf(f),style:`stroke-width:${(sel===f?2:1.2)*Math.max(vbk,0.12)}px`});d.addEventListener('click',ev=>{ev.stopPropagation();if(drag&&drag.moved)return;selectFac(f)});d.addEventListener('dblclick',ev=>{ev.stopPropagation();const w=0.55*SX*2,h=w*0.82;animateView([x-w/2,y-h/2,w,h]);setTimeout(()=>drawDots(cur),450)});
    const tt=el('title');tt.textContent=`${f.n} — ${SCHEMES[Q].title}: ${(SCHEMES[Q].lbl||{})[f[Q]]||f[Q]}`;d.append(tt);gDots.append(d);
    if(prov){placed.push({x,y,r,f})}});
  if(prov){const vb=svg.getAttribute('viewBox').split(' ').map(Number);const k=vb[2]/540;const boxes=[];
    const short=n=>n.replace(/\s*\(.*?\)/g,'').replace(/ (Medico-?legal Mortuary|Forensic Pathology (Institute|Service|Laboratory|Facility)|Holding Facility)$/i,'').trim();
    gLab.querySelectorAll('text').forEach(t=>{t.style.fontSize=(t.classList.contains('plabel')?13:11)*k+'px';t.style.display=(k<0.22||t.dataset.p!==prov)?'none':''});
    placed.forEach(({x,y,r,f})=>{const txt=k<0.35?short(f.n):f.t.split(' (')[0];const w=txt.length*5.2*k,h=9*k;
      const cands=[[x+r+2*k,y+3*k],[x-r-2*k-w,y+3*k],[x-w/2,y-r-3*k],[x-w/2,y+r+10*k]];
      const ok=c=>!boxes.some(b=>c[0]<b[0]+b[2]&&c[0]+w>b[0]&&c[1]-h<b[1]&&c[1]>b[1]-b[3]);
      const c=cands.find(ok);if(!c)return;boxes.push([c[0],c[1],w,h]);
      const t=el('text',{x:c[0],y:c[1],class:'dlabel',style:`font-size:${9*k}px;stroke-width:${2.5*k}px`});t.textContent=txt;gDots.append(t)})}}
function showProv(name){cur=name;sel=null;document.querySelectorAll('.prov').forEach(p=>{p.classList.toggle('active',p.dataset.p===name);p.classList.toggle('dim',p.dataset.p!==name)});
  const b=bbox[name],pad=18;animateView([b.x-pad,b.y-pad,b.width+2*pad,(b.width+2*pad)*0.82>b.height+2*pad?(b.width+2*pad)*0.82:b.height+2*pad]);
  document.getElementById('btnCorr').hidden=false;drawDots(name);renderPanel(name)}
function showAll(){cur=null;sel=null;corridor=false;gLab.querySelectorAll('text').forEach(t=>{t.style.fontSize='';t.style.display=''});document.querySelectorAll('.prov').forEach(p=>p.classList.remove('active','dim'));animateView(home);document.getElementById('btnCorr').hidden=true;drawDots(null);renderPanel(null)}
function selectFac(f){sel=f;drawDots(cur);renderPanel(cur)}
function count(list,fn){return list.filter(fn).length}
function renderPanel(prov){
  if(!prov){const answered=count(FAC,f=>f.acc!=='Unknown');
    panel.innerHTML=`<h2>South Africa</h2><div class="sub">145 designated facilities in nine provinces. Click a province.</div>
    <div class="stats"><div class="stat"><b>145</b><small>Facilities</small></div><div class="stat"><b>${answered}</b><small>Answered</small></div><div class="stat"><b>${count(FAC,f=>f.lat)}</b><small>Mapped</small></div><div class="stat"><b>${Math.round(answered/145*100)}%</b><small>Complete</small></div></div>
    <table><thead><tr><th>Province</th><th>Facilities</th><th>Answered</th><th>Mapped</th></tr></thead><tbody>${STATES.map(s=>{const l=byProv[s.name]||[];return `<tr class="row" data-p="${s.name}"><td>${s.name}</td><td>${l.length}</td><td>${count(l,f=>f.acc!=='Unknown')}</td><td>${count(l,f=>f.lat)}</td></tr>`}).join('')}</tbody></table>
    <p class="note">"Mapped" means the Register holds coordinates for the facility. Western Cape coordinates are from the Register; Northern Cape are approximate town centres; the rest are added as the Register is completed.</p>`;
    panel.querySelectorAll('tr.row').forEach(r=>r.addEventListener('click',()=>showProv(r.dataset.p)));return}
  const l=byProv[prov]||[];const answered=count(l,f=>f.acc!=='Unknown');
  panel.innerHTML=`<h2>${prov}</h2><div class="sub">${l.length} designated facilities · ${answered} answered · ${count(l,f=>f.acc==='None')} with no access</div>
  <div class="stats"><div class="stat"><b>${count(l,f=>f.acc==='Owned'||f.acc==='MOU')}</b><small>Owned / MOU</small></div><div class="stat"><b>${count(l,f=>f.acc==='Informal')}</b><small>Informal</small></div><div class="stat"><b>${count(l,f=>f.acc==='None')}</b><small>No access</small></div><div class="stat"><b>${count(l,f=>f.acc==='Unknown')}</b><small>Unknown</small></div></div>
  <div class="tscroll"><table><thead><tr><th>Facility</th><th>${SCHEMES[Q].title}</th><th>Cases/mo</th></tr></thead><tbody>${l.map((f,i)=>`<tr class="row${sel===f?' sel':''}" data-i="${i}"><td>${f.n}</td><td><span class="pill" style="background:${colorOf(f)}">${(SCHEMES[Q].lbl||{})[f[Q]]||f[Q]}</span></td><td style="font-variant-numeric:tabular-nums">${f.m??'–'}</td></tr>`).join('')}</tbody></table></div>
  ${sel?`<div class="detail"><strong>${sel.n}</strong><dl><dt>Town</dt><dd>${sel.t}</dd><dt>Imaging available</dt><dd>${sel.img}</dd><dt>Access basis</dt><dd>${LBL[sel.acc]}</dd><dt>Most needed</dt><dd>${sel.need}</dd><dt>Est. % indication classes</dt><dd>${sel.pct}</dd><dt>Main barrier</dt><dd>${sel.bar}</dd><dt>Source</dt><dd>${sel.src==='illustrative'?'Illustrative demo answer':sel.src==='register'?'Register (unanswered)':'Register (coordinates pending)'}</dd></dl></div>`:'<p class="note">Click a row or a dot for the five Stage 1 answers. Scroll or pinch to zoom, drag to pan, double-click a dot to zoom to its cluster.</p>'}
  ${prov==='Northern Cape'?'<p class="note">Northern Cape answers are illustrative, entered to show the chain from sheet to map. The corridor button draws 150 km around any facility with owned or MOU imaging: facilities inside it are MOU-corridor cases, outside it procurement cases.</p>':''}`;
  panel.querySelectorAll('tr.row').forEach(r=>r.addEventListener('click',()=>selectFac(l[+r.dataset.i])))}
document.getElementById('btnAll').addEventListener('click',showAll);
document.getElementById('qsel').addEventListener('change',e=>{Q=e.target.value;renderLegend();drawDots(cur);renderPanel(cur)});
renderLegend();
document.getElementById('btnCorr').addEventListener('click',()=>{corridor=!corridor;drawDots(cur)});
const start=d=>{drawDots(null);renderPanel(null);if(d&&d.prov&&bbox[d.prov])showProv(d.prov)};
window.claude?.hot?.snapshot?.(()=>({prov:cur}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script></body></html>
